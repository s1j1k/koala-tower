<body>
<noscript><div class="page" style="position:static"><h1>Koala Tower: free ATC selection test practice</h1><p class="sub">This practice game needs JavaScript. Please turn it on, or read <a class="link" href="about.html">about Koala Tower</a>.</p></div></noscript>

<!-- WORLD: fly between lessons -->
<section id="scr-world" class="screen">
  <canvas id="worldCanvas"></canvas>
  <div class="w-top">
    <button class="pill" id="wRank" aria-label="Pilot profile"><span id="wRankIcon">🐣</span> <span id="wRankName">Student</span> <small id="wXp">0 XP</small></button>
    <div class="w-btns">
      <button class="iconbtn" id="wView" aria-label="Switch view">↕️</button>
      <button class="iconbtn" id="wBook" aria-label="Lesson list">📖</button>
      <button class="iconbtn" id="wSet" aria-label="Settings">⚙️</button>
    </div>
  </div>
  <div class="tower" id="wTower"><span class="koala">🐨</span><span id="wTowerTxt">Koala Tower: welcome aboard!</span></div>
  <div class="w-ctrls" id="wCtrls">
    <button class="hold" id="wLeft" aria-label="Turn left">⟲<small id="wLeftLbl">LEFT</small></button>
    <button class="hold mid" id="wMid" aria-label="Lessons">✈️<small id="wMidLbl">LESSONS</small></button>
    <button class="hold" id="wRight" aria-label="Turn right">⟳<small id="wRightLbl">RIGHT</small></button>
  </div>
</section>

<!-- LOGBOOK: plain list of every lesson -->
<section id="scr-book" class="screen hidden page">
  <div class="pagebar"><button class="iconbtn" data-back>←</button><h1>Logbook</h1><span></span></div>
  <div id="bookBody"></div>
</section>

<!-- PROFILE -->
<section id="scr-profile" class="screen hidden page">
  <div class="pagebar"><button class="iconbtn" data-back>←</button><h1>Pilot profile</h1><span></span></div>
  <div id="profBody"></div>
</section>

<!-- SETTINGS -->
<section id="scr-settings" class="screen hidden page">
  <div class="pagebar"><button class="iconbtn" data-back>←</button><h1>Settings</h1><span></span></div>
  <div id="setBody"></div>
</section>

<!-- PLAY: drill runner -->
<section id="scr-play" class="screen hidden page play">
  <div class="phud">
    <button class="iconbtn" id="pQuit" aria-label="Quit">✕</button>
    <div class="ptitle"><b id="pName"></b><small id="pLevel"></small></div>
    <div class="pscore"><b id="pScore">0</b><small id="pCombo"></small></div>
  </div>
  <div class="pbar"><i id="pBar"></i></div>
  <div class="ptime" id="pTime"></div>
  <div id="pStage"></div>
</section>

<!-- RESULTS -->
<section id="scr-results" class="screen hidden page">
  <div id="resBody"></div>
</section>

<div id="sheetWrap" class="hidden"><div class="backdrop" id="sheetBack"></div><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast hidden"></div>
<div id="fx"></div>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/runner.js"></script>
<script src="js/drills/maths.js"></script>
<script src="js/drills/puzzles.js"></script>
<script src="js/drills/spatial.js"></script>
<script src="js/drills/memory.js"></script>
<script src="js/drills/detail.js"></script>
<script src="js/drills/coded.js"></script>
<script src="js/drills/radar.js"></script>
<script src="js/world.js"></script>
<script src="js/screens.js"></script>
</body>
</html>
